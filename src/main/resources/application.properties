server.port=${PORT:8080}
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URI:mongodb://admin:admin123@localhost:27019/clase_db?authSource=admin}}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/clase_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin123}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=600000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=18800
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Criptografia AES (soporta inyeccion por variable de entorno o Secret Manager)
app.crypto.iv=${APP_CRYPTO_IV:p5ldmBPdd/9pjC0bDC/nSg==}
app.crypto.key=${APP_CRYPTO_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}

# GestoPago - Autenticacion y Token Bearer protegido
gestopago.auth.url=${GESTOPAGO_URL:https://gestopago.portalventas.net}
gestopago.auth.bearer-token=${GESTOPAGO_BEARER_TOKEN:}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

# GestoPago - Parametros operativos de SendTx y Conciliacion
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:${gestopago.auth.codigo-dispositivo}}
gestopago.tx.monto-minimo=${GESTOPAGO_TX_MONTO_MINIMO:1.00}
gestopago.tx.monto-maximo=${GESTOPAGO_TX_MONTO_MAXIMO:50000.00}
gestopago.tx.duplicate-window-seconds=${GESTOPAGO_TX_DUPLICATE_WINDOW_SECONDS:60}
gestopago.tx.conciliacion-inmediata=${GESTOPAGO_TX_CONCILIACION_INMEDIATA:true}
gestopago.tx.conciliacion.cron=${GESTOPAGO_CONCILIACION_CRON:0 */5 * * * *}
gestopago.tx.conciliacion.max-intentos=${GESTOPAGO_CONCILIACION_MAX_INTENTOS:5}
gestopago.verify.path=${GESTOPAGO_VERIFY_PATH:/sistema/service/verifyTx.do}

# Timeouts Feign SendTx
gestopago.sendtx.connect-timeout-ms=${GESTOPAGO_SENDTX_CONNECT_TIMEOUT_MS:5000}
gestopago.sendtx.read-timeout-ms=${GESTOPAGO_SENDTX_READ_TIMEOUT_MS:15000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.proyecto.servicios=INFO