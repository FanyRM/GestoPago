services:
  postgres:
    image: postgres:16-alpine
    container_name: prueba-postgres
    restart: always
    environment:
      POSTGRES_DB: clase_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: prueba-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: clase_db
    ports:
      - "27019:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
