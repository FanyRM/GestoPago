services:
  postgres:
    image: postgres:16-alpine
    container_name: prueba-postgres
    restart: always
    environment:
      POSTGRES_DB: clase_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      # Credenciales de administrador de Keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin12345!}

      # Base de datos PostgreSQL registrada para el proyecto (clase_db)
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/clase_db}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-admin}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-admin123}
    ports:
      # Mapeamos a 8081 para no colisionar con el puerto 8080 de la aplicacion Spring Boot
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  mongodb:
    image: mongo:7.0
    container_name: prueba-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: clase_db
    ports:
      - "27019:27017"
    volumes:
      - mongodata:/data/db

  sonarqube:
    image: sonarqube:lts-community
    container_name: prueba-sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  pgdata:
  mongodata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
